<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Classic Buffet - Dish Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ✅ Matomo Tracking Code -->
  <script>
    var _paq = window._paq = window._paq || [];
    _paq.push(['trackPageView']);
    _paq.push(['enableLinkTracking']);
    (function () {
      var u = "https://tracker.neogroup.com.sg/";
      _paq.push(['setTrackerUrl', u + 'matomo.php']);
      _paq.push(['setSiteId', '14']);
      var d = document, g = d.createElement('script'), s = d.getElementsByTagName('script')[0];
      g.async = true; g.src = u + 'matomo.js'; s.parentNode.insertBefore(g, s);
    })();
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      color: #e4002b;
    }

    .menu-section {
      max-width: 800px;
      margin: 2rem auto;
    }

    .menu-category {
      background: #fff;
      padding: 1rem;
      margin-bottom: 2rem;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }

    .spn_category_name {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #333;
    }

    .radio-success, .checkbox-success {
      background: #fefefe;
      padding: 0.75rem;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dish-label {
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>Select Dishes for Your Package</h1>

  <div class="menu-section" id="menuSelectSection">
    <!-- Categories and dishes will be loaded here -->
  </div>

  <script>
    // ✅ Simulated backend dishes grouped by category
    const dishData = {
      ValueA: {
        "Main Course": [
          { id: "dish_101", name: "Stir-Fried Vegetables", type: "radio", group: "main" },
          { id: "dish_102", name: "Chicken Curry", type: "radio", group: "main" }
        ],
        "Add-Ons": [
          { id: "dish_201", name: "Spring Rolls", type: "checkbox", group: "addons" },
          { id: "dish_202", name: "Fruit Platter", type: "checkbox", group: "addons" }
        ]
      },
      SimplicityB: {
        "Main Course": [
          { id: "dish_103", name: "Lemon Fish", type: "radio", group: "main" },
          { id: "dish_104", name: "Mutton Rendang", type: "radio", group: "main" }
        ],
        "Desserts": [
          { id: "dish_203", name: "Ice Jelly", type: "checkbox", group: "addons" },
          { id: "dish_204", name: "Chocolate Éclairs", type: "checkbox", group: "addons" }
        ]
      }
    };

    function getSelectedPackage() {
      const params = new URLSearchParams(window.location.search);
      return params.get("package") || "ValueA";
    }

    function renderDishes(packageName) {
      const container = document.getElementById('menuSelectSection');
      const categories = dishData[packageName] || {};

      Object.entries(categories).forEach(([categoryName, dishes]) => {
        const categoryDiv = document.createElement('div');
        categoryDiv.className = 'menu-category';

        const categoryTitle = document.createElement('div');
        categoryTitle.className = 'spn_category_name';
        categoryTitle.textContent = categoryName;

        categoryDiv.appendChild(categoryTitle);

        dishes.forEach(dish => {
          const wrapper = document.createElement('div');
          wrapper.className = dish.type === 'radio' ? 'radio radio-success' : 'checkbox checkbox-success';

          const input = document.createElement('input');
          input.className = 'valid';
          input.type = dish.type;
          input.name = dish.group;
          input.value = dish.id;

          const label = document.createElement('label');
          label.className = 'dish-label';
          label.textContent = dish.name;

          wrapper.appendChild(label);
          wrapper.appendChild(input);
          categoryDiv.appendChild(wrapper);
        });

        container.appendChild(categoryDiv);
      });
    }

    // ✅ Matomo helpers
    function pushDataToMatomo(dishId, dishName, categoryName, price) {
      _paq.push(['setEcommerceView', dishId, dishName, categoryName, price || 0]);
      _paq.push(['trackPageView']);
    }

    function getDishName(input) {
      const container = input.closest('.radio-success, .checkbox-success');
      if (container) {
        const label = container.querySelector('.dish-label');
        if (label && label.innerText.trim()) {
          return label.innerText.trim();
        }
      }
      return input.value || 'Unknown Dish';
    }

    function getCategoryTitle(input) {
      const wrapper = input.closest('.menu-category');
      const cat1 = wrapper && wrapper.querySelector('.spn_category_name')
        ? wrapper.querySelector('.spn_category_name').innerText.trim()
        : '';
      if (cat1) return cat1;

      const prev = input.closest('li') ? input.closest('li').previousElementSibling : null;
      const cat2 = prev ? (prev.innerText || '').trim() : '';
      if (cat2) return cat2;

      return 'Unknown Category';
    }

    function handleRadioInteraction(inputElement, action) {
      const itemId = inputElement.value;
      const dishName = getDishName(inputElement);
      const categoryTitle = getCategoryTitle(inputElement);

      _paq.push(['trackEvent', categoryTitle, action, dishName, 0]);
      if (action === 'Selected') {
        pushDataToMatomo(itemId, dishName, categoryTitle, 0);
      }
    }

    function handleCheckboxInteraction(inputElement, action) {
      const itemId = inputElement.value;
      const dishName = getDishName(inputElement);
      const categoryTitle = getCategoryTitle(inputElement);

      _paq.push(['trackEvent', categoryTitle, action, dishName, 0]);
      if (action === 'Selected') {
        pushDataToMatomo(itemId, dishName, categoryTitle, 0);
      }
    }

    const prevSelectedByGroup = new Map();

    function initPrevSelectedRadios() {
      document.querySelectorAll('.radio-success input[type="radio"]').forEach(r => {
        if (r.checked) prevSelectedByGroup.set(r.name, r);
      });
    }

    function attachRadioTracking() {
      document.querySelectorAll('.radio-success input[type="radio"]').forEach((input) => {
        if (input.dataset.tracked) return;
        input.dataset.tracked = 'true';
        input.addEventListener('change', function () {
          const group = this.name;
          const prev = prevSelectedByGroup.get(group);
          if (prev && prev !== this) {
            handleRadioInteraction(prev, 'Deselected');
          }
          handleRadioInteraction(this, 'Selected');
          prevSelectedByGroup.set(group, this);
        });
      });
    }

    function attachCheckboxTracking() {
      document.querySelectorAll('.checkbox-success input[type="checkbox"]').forEach((input) => {
        if (input.dataset.tracked) return;
        input.dataset.tracked = 'true';
        input.addEventListener('change', function () {
          handleCheckboxInteraction(this, this.checked ? 'Selected' : 'Deselected');
        });
      });
    }

    const menuObserver = new MutationObserver(() => {
      attachRadioTracking();
      attachCheckboxTracking();
    });

    const menuSelectSection = document.querySelector('#menuSelectSection');
    if (menuSelectSection) {
      menuObserver.observe(menuSelectSection, { childList: true, subtree: true });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const pkg = getSelectedPackage();
      renderDishes(pkg);
      initPrevSelectedRadios();
      attachRadioTracking();
      attachCheckboxTracking();
    });
  </script>
</body>
</html>
