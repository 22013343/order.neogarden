<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delivery Details</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font-family: Arial; margin: 20px; }
    .container { display: flex; gap: 30px; }
    .left-panel {
      width: 300px;
      border: 1px solid #ccc;
      padding: 20px;
    }
    .right-panel {
      flex: 1;
      border: 1px solid #ccc;
      padding: 20px;
    }
    h2, h4 { margin-bottom: 10px; }
    .summary-table td {
      padding: 4px 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    input[type="text"], input[type="email"], input[type="number"], select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    .next-btn {
      background: green;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Delivery Details</h1>
<div class="container">

  <!-- LEFT: Cart Summary -->
  <div class="left-panel">
    <h3>Your Selection</h3>
    <ul id="cart-list"></ul>
    <h4>Order Summary</h4>
    <table class="summary-table">
      <tbody id="summary-rows">
        <!-- Filled by JS -->
      </tbody>
    </table>
    <h3>Total: $<span id="grand-total">0.00</span></h3>
  </div>

  <!-- RIGHT: Form -->
  <div class="right-panel">
    <form id="delivery-form">
      <h2>Personal Information</h2>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="fullname" required />
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" required />
      </div>

      <div class="form-group">
        <label>Mobile</label>
        <input type="text" name="mobile" required />
      </div>

      <h2>Billing Address</h2>

      <div class="form-group">
        <label>Street Address</label>
        <input type="text" name="billing_address" required />
      </div>

      <div class="form-group">
        <label>Postal Code</label>
        <input type="text" name="billing_postal" required />
      </div>

      <h2>Delivery Address</h2>

      <div class="form-group">
        <input type="checkbox" id="same-address" />
        <label for="same-address">Same as billing address</label>
      </div>

      <div class="form-group">
        <label>Street Address</label>
        <input type="text" name="delivery_address" required />
      </div>

      <div class="form-group">
        <label>Postal Code</label>
        <input type="text" name="delivery_postal" required />
      </div>

      <h2>Delivery Info</h2>

      <div class="form-group">
        <label>Date</label>
        <input type="date" name="delivery_date" required />
      </div>

      <div class="form-group">
        <label>Time</label>
        <input type="time" name="delivery_time" required />
      </div>

      <div class="form-group">
        <label>Additional Notes</label>
        <input type="text" name="notes" />
      </div>

      <button type="submit" class="next-btn">Submit Order</button>
    </form>
  </div>

</div>

<script>
  // Load cart from localStorage
  const cart = JSON.parse(localStorage.getItem('cart')) || [];
  const list = document.getElementById('cart-list');
  const summary = document.getElementById('summary-rows');
  let grandTotal = 0;

  cart.forEach(item => {
    const li = document.createElement('li');
    li.textContent = `${item.name} x ${item.quantity}`;
    list.appendChild(li);

    const price = guessPrice(item.name);
    const subtotal = price * item.quantity;
    grandTotal += subtotal;

    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${item.name}</td><td style="text-align:right;">$${subtotal.toFixed(2)}</td>`;
    summary.appendChild(tr);
  });

  document.getElementById('grand-total').textContent = grandTotal.toFixed(2);

  function guessPrice(name) {
    name = name.toLowerCase();
    if (name.includes("neo garden")) return 99;
    if (name.includes("founder") || name.includes("vegetarian")) return 138;
    if (name.includes("heatpro")) return 10;
    if (name.includes("diy")) return 6;
    if (name.includes("drink")) return 2;
    return 8; // fallback
  }

  // Same address checkbox
  document.getElementById('same-address').addEventListener('change', (e) => {
    if (e.target.checked) {
      const billing = document.querySelector('input[name="billing_address"]').value;
      const postal = document.querySelector('input[name="billing_postal"]').value;
      document.querySelector('input[name="delivery_address"]').value = billing;
      document.querySelector('input[name="delivery_postal"]').value = postal;
    }
  });

  // Submit form
  document.getElementById('delivery-form').addEventListener('submit', e => {
    e.preventDefault();
    alert("Order Submitted Successfully!");
    localStorage.clear(); // simulate checkout
    window.location.href = 'thankyou.html'; // redirect
  });
</script>

</body>
</html>
