  <style>
    body { font-family: Arial, sans-serif; background: #fdfbf8; padding: 2rem; }
    h1 { text-align: center; color: #e4002b; }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));

      cursor: pointer;
      transition: transform 0.2s;
      text-align: center;
      text-decoration: none;
      color: inherit;
    }
    .menu-card:hover {
      transform: translateY(-5px);
    }
  </style>
</head>
<body>

  <h1>Select Your Classic Buffet Package</h1>

  <div class="menu-grid">

</body>
</html>
