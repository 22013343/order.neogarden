<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Thank You</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #fdfcf9;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #fcfbf9;
    }
    header img {
      height: 50px;
    }
    header nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #333;
      font-weight: bold;
    }
    .thank-you-container {
      margin-top: 50px;
    }
    .thank-you-container img {
      width: 200px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      color: #333;
    }
    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }
    .home-btn {
      background-color: #f7941d;
      color: white;
      padding: 12px 24px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <img src="logo.png" alt="Neo Garden Logo" />
    <nav>
      <a href="index.html">Home</a>
      <a href="#">Log In</a>
    </nav>
  </header>

  <div class="thank-you-container">
    <img src="mascot.png" alt="Thank You Mascot" />
    <h1>Thank you!</h1>
    <p>We are processing the order and you will receive an email shortly.</p>
    <a href="index.html" class="home-btn">BACK TO HOME PAGE</a>
  </div>

</body>
</html>
